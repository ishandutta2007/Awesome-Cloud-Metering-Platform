<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#9333ea" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <style>
      .pulse-line {
        stroke-dasharray: 200 400;
        animation: pulse 6s linear infinite;
      }
      .float-node {
        animation: float 4s ease-in-out infinite alternate;
      }
      .float-node-delayed {
        animation: float 5s ease-in-out infinite alternate-reverse;
      }
      @keyframes pulse {
        0% { stroke-dashoffset: 600; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes float {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-12px); }
      }
    </style>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="320" fill="url(#bg)" rx="16"/>

  <!-- Background Dynamic Mesh & Flow Lines (Behind text) -->
  <g opacity="0.35">
    <path d="M-50 220 Q 200 80, 500 240 T 1000 160 T 1250 280" fill="none" stroke="#38bdf8" stroke-width="2" class="pulse-line"/>
    <path d="M-50 260 Q 300 120, 650 260 T 1100 120 T 1250 200" fill="none" stroke="#818cf8" stroke-width="2.5" class="pulse-line" style="animation-duration: 8s;"/>
    <path d="M-50 140 Q 400 280, 750 140 T 1150 260" fill="none" stroke="#c084fc" stroke-width="1.5" class="pulse-line" style="animation-duration: 10s;"/>
  </g>

  <!-- Decorative Abstract Graphics & Cards (Dynamic Visuals placed cleanly on right & background) -->
  <g transform="translate(820, 40)" class="float-node">
    <!-- Metering Dashboard Card Overlay -->
    <rect x="0" y="0" width="320" height="230" rx="16" fill="#1e293b" fill-opacity="0.75" stroke="#475569" stroke-width="1.5"/>
    <rect x="20" y="25" width="120" height="12" rx="6" fill="#38bdf8" fill-opacity="0.8"/>
    <rect x="20" y="48" width="80" height="8" rx="4" fill="#64748b"/>
    
    <!-- Mini Histogram / Bar Chart -->
    <rect x="20" y="160" width="24" height="40" rx="4" fill="#6366f1"/>
    <rect x="54" y="130" width="24" height="70" rx="4" fill="#818cf8"/>
    <rect x="88" y="100" width="24" height="100" rx="4" fill="#38bdf8"/>
    <rect x="122" y="145" width="24" height="55" rx="4" fill="#c084fc"/>
    <rect x="156" y="80" width="24" height="120" rx="4" fill="#a855f7"/>
    <rect x="190" y="115" width="24" height="85" rx="4" fill="#38bdf8"/>
    <rect x="224" y="65" width="24" height="135" rx="4" fill="#34d399"/>
    
    <!-- Live Badge -->
    <rect x="230" y="20" width="65" height="22" rx="11" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1"/>
    <circle cx="243" cy="31" r="4" fill="#10b981"/>
    <text x="253" y="35" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="bold" fill="#34d399">REALTIME</text>
  </g>

  <g transform="translate(750, 160)" class="float-node-delayed">
    <!-- Floating Node Event Badge -->
    <rect x="0" y="0" width="210" height="60" rx="12" fill="#0f172a" fill-opacity="0.85" stroke="#818cf8" stroke-width="1.5" filter="url(#glow)"/>
    <circle cx="30" cy="30" r="14" fill="#6366f1" fill-opacity="0.3"/>
    <path d="M25 30 L29 34 L36 26" fill="none" stroke="#818cf8" stroke-width="2.5" stroke-linecap="round"/>
    <text x="54" y="27" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#f8fafc">250K+ Events/sec</text>
    <text x="54" y="43" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#94a3b8">Stream Ingestion &amp; Billing</text>
  </g>

  <!-- Foreground Content: Main Titles (Completely unobstructed in foreground) -->
  <g transform="translate(60, 0)">
    <!-- Decorative Category Pill -->
    <g transform="translate(0, 50)">
      <rect x="0" y="0" width="310" height="30" rx="15" fill="url(#accentGrad)" stroke="#818cf8" stroke-width="1"/>
      <text x="15" y="19" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#e0e7ff" letter-spacing="0.5">
        ⚡ AWESOME CLOUD METERING ECOSYSTEM
      </text>
    </g>

    <!-- Main Title -->
    <text x="0" y="135" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" fill="url(#titleGrad)" letter-spacing="-0.5">
      Awesome Cloud Metering
    </text>
    <text x="0" y="180" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
      &amp; Usage-Based Billing
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="222" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400" fill="#94a3b8">
      Curated List of SaaS Platforms &amp; Open-Source Metering Pipelines
    </text>

    <!-- Tech Highlights Bar -->
    <g transform="translate(0, 248)">
      <text x="0" y="15" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#cbd5e1">
        🚀 Real-Time Event Aggregation  •  💰 Usage-Based Invoicing  •  🔒 Entitlements  •  🤖 LLM Cost Tracking
      </text>
    </g>
  </g>
</svg>
